[package]
name = "syncbond-server"
description = "Default self-hosted syncbond relay: ciphertext-only sync server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "syncbond-server"
path = "src/main.rs"

[dependencies]
syncbond-relay-protocol = { path = "../../crates/syncbond-relay-protocol" }
rusqlite.workspace = true
axum.workspace = true
tokio.workspace = true
base64.workspace = true
sha2.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Real socket coverage (todo.md DSR-19): binding and dialing a listener
# needs the `net` feature, and `#[tokio::test]` drives it on a runtime,
# neither of which the workspace-level tokio reference turns on for the
# server binary itself.
tokio = { workspace = true, features = ["net", "rt", "macros", "time"] }
