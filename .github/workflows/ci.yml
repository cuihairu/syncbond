name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      # tests/ffi_python.rs drives a full maturin wheel build + pytest, so the
      # python toolchain must be present wherever `cargo test` runs.
      - run: python -m pip install --upgrade "maturin>=1.5" pytest
      # tests/ffi_java.rs runs the Gradle wrapper, which predates JDK 25's
      # class file v69; pin the same JDK the java job uses.
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # DSR-52: the server network acceptance, as its own job. The two suites boot
  # the shipped relay binary as its own process — a fresh data directory and
  # real loopback sockets per test — so the run needs no public network and no
  # pre-existing database. The job timeout turns a hung suite into a failure.
  # The output is retained with credentials redacted (a 64-lowercase-hex run
  # is the admin bootstrap credential or a device token; `ch_`/`cred_` ids are
  # public handles and are left readable). This job has no release authority:
  # versioned release authorization lives entirely in the nightly/release
  # workflows and is untouched here.
  server-acceptance:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Run the network acceptance suites
        shell: bash
        run: |
          set -o pipefail
          cargo test -p syncbond-server \
            --test ciphertext_boundary_suite \
            --test resource_shutdown_suite \
            2>&1 | tee acceptance-raw.log
      - name: Redact credentials from the log
        if: always()
        shell: bash
        run: |
          test -f acceptance-raw.log || exit 0
          sed -E 's/\b[0-9a-f]{64}\b/[REDACTED]/g' acceptance-raw.log > acceptance.log
      - name: Retain the sanitized acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-acceptance-log
          path: acceptance.log

  coverage:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2.9.3
      # tests/ffi_python.rs drives a full maturin wheel build + pytest, so the
      # python toolchain must be present wherever coverage runs cargo test.
      - run: python -m pip install --upgrade "maturin>=1.5" pytest
      # tests/ffi_java.rs runs the Gradle wrapper, which predates JDK 25's
      # class file v69; pin the same JDK the java job uses.
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
      - name: Write coverage summary
        shell: bash
        run: |
          cargo llvm-cov report --json --output-path coverage.json
          coverage_summary="$(jq -r '.data[0].totals.lines.percent' coverage.json)"
          printf 'Line coverage: `%s%%`\n' "${coverage_summary}" >> "${GITHUB_STEP_SUMMARY}"
          rm -- coverage.json
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
  bindings-ts:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: wasm-pack
      - run: pnpm --filter @syncbond/bindings-ts build
      - run: pnpm --filter @syncbond/bindings-ts build:wasm
      - run: pnpm --filter @syncbond/bindings-ts test
      # DSR-53: the Node and browser-WASM relay e2e harnesses skip in the
      # `rust` job (no napi CLI or wasm-pack there), and the `node --test`
      # run above skips its relay suites without a relay — so each harness
      # runs here, as its own step and its own result. Each harness boots a
      # real relay, points the language suite at it over real sockets, and
      # the suite drives two independent processes / browser contexts; the
      # cross-language conformance runner never substitutes for this.
      - name: Node relay e2e (two Node processes over a real relay)
        run: cargo test -p syncbond-napi --test node_smoke
      - name: Browser-WASM relay e2e (two browser contexts over a real relay)
        run: cargo test -p syncbond-wasm --test wasm_node
      - run: pnpm -r typecheck
      # SYNCBOND-WEB-001: the demo compiles and bundles against the same
      # wasm-gen output the tests above exercised.
      - run: pnpm --filter @syncbond/web build
      - run: pnpm --filter @syncbond/docs build
      - run: node scripts/verify-docs-links.mjs
  docs:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
      - run: pnpm --filter @syncbond/docs test
  # Build the release static library once, then run the Go binding's suite with
  # and without cgo. The CGO_ENABLED=0 run proves the no-cgo build fails loudly
  # rather than silently producing empty state.
  go:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'
      - run: cargo build --release -p syncbond-ffi
      - run: go test ./...
        working-directory: crates/syncbond-ffi/go
      - run: CGO_ENABLED=0 go test ./...
        working-directory: crates/syncbond-ffi/go
  # Build the Python wheel on every OS the SDK claims support for and run the
  # pytest suite against the installed wheel. Wheels land as build artifacts
  # only; publishing a versioned release is a manual step.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - shell: bash
        run: python -m pip install --upgrade "maturin>=1.5" pytest
      # rust-cache restores target/ wholesale; stale wheels/site dirs from a
      # previous run must not survive into this build (pip --target refuses to
      # replace existing dirs without --upgrade, so old code can win).
      - shell: bash
        run: rm -rf target/wheels target/site
      - shell: bash
        run: maturin build -m crates/syncbond-python/Cargo.toml --release -o target/wheels
      - name: Install the wheel and run the pytest suite
        shell: bash
        run: |
          mkdir -p target/site
          python -m pip install --quiet --target target/site target/wheels/*.whl
          PYTHONPATH=target/site python -m pytest -q crates/syncbond-python/tests/test_pair_sync.py
      - name: Run the example program
        shell: bash
        run: PYTHONPATH=target/site python crates/syncbond-python/examples/pair_sync.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl
  # The Java SDK compiles the JNI shim against the release C ABI library and
  # runs the JUnit suite; the artifact publishes to the local Maven repo only.
  java:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - run: cargo build --release -p syncbond-ffi
      - run: gradle test
        working-directory: crates/syncbond-ffi/java
      - run: gradle publishToMavenLocal
        working-directory: crates/syncbond-ffi/java
  # The C# SDK packs into a local NuGet feed, restores the package from that
  # feed and runs the xUnit suite; no remote feed is involved.
  csharp:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: '10.0.x'
      - run: cargo build --release -p syncbond-ffi
      - run: dotnet pack Syncbond -c Release -o artifacts
        working-directory: crates/syncbond-ffi/csharp
      - run: dotnet test Syncbond.Tests -c Release
        working-directory: crates/syncbond-ffi/csharp
        env:
          SYNCBOND_NATIVE: ${{ github.workspace }}/target/release/libsyncbond_ffi.so
      - run: dotnet run --project Syncbond.Example
        working-directory: crates/syncbond-ffi/csharp
        env:
          SYNCBOND_NATIVE: ${{ github.workspace }}/target/release/libsyncbond_ffi.so
