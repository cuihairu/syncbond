# Rolling nightly builds. This is NOT a formal release channel: no version tag
# is created, and assets publish to the single rolling `nightly` prerelease ONLY
# after fmt + clippy + the full workspace test suite pass. Scheduled runs skip
# entirely when main has no commit in the last 48 hours; workflow_dispatch
# always builds. npm/crates.io publishing stays blocked — versioned releases
# are issued manually by the maintainer only.
name: Nightly build
on:
  schedule:
    # 04:23 Asia/Shanghai; use an off-minute to reduce scheduler contention.
    - cron: '23 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  # Test gate, CI-同口径 (same steps as the ci.yml rust job), plus the 48h
  # freshness gate (custos pattern): a scheduled wake with no new commit on
  # origin/main skips everything downstream; manual dispatch always builds.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: 48h freshness gate (scheduled runs only)
        id: fresh
        run: |
          fresh=true
          if [ "${{ github.event_name }}" = "schedule" ] &&
             [ -z "$(git log -1 --since='48 hours ago' --format=%H origin/main)" ]; then
            fresh=false
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "fresh: $fresh"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.fresh.outputs.fresh == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        if: steps.fresh.outputs.fresh == 'true'
      # tests/ffi_python.rs drives a full maturin wheel build + pytest, so the
      # python toolchain must be present wherever `cargo test` runs.
      - run: python -m pip install --upgrade "maturin>=1.5" pytest
        if: steps.fresh.outputs.fresh == 'true'
      - run: cargo fmt --all -- --check
        if: steps.fresh.outputs.fresh == 'true'
      - run: cargo clippy --all-targets -- -D warnings
        if: steps.fresh.outputs.fresh == 'true'
      - run: cargo test
        if: steps.fresh.outputs.fresh == 'true'
  # Core static library per target. Both runners are the same arch as their
  # target, so the C acceptance face (ffi_c/ffi_cpp suites: header under
  # -Wall -Werror, pure-C pair+sync program) runs natively against a host
  # build while the packaged .a is the musl static build of the same code.
  core:
    needs: gate
    if: needs.gate.outputs.fresh == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: nightly-${{ matrix.target }}
      - name: Install static build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build musl static library
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release -p syncbond-ffi --target '${{ matrix.target }}'
      - name: C acceptance face (native arch)
        run: cargo test --release -p syncbond-ffi
      - name: Package header + static library
        run: |
          mkdir -p dist/pkg
          cp -r crates/syncbond-ffi/include dist/pkg/include
          cp "target/${{ matrix.target }}/release/libsyncbond_ffi.a" dist/pkg/libsyncbond_ffi.a
          cat > dist/pkg/BUILD_INFO <<EOF
          project: syncbond
          channel: nightly (rolling prerelease; not a stable release)
          commit: ${GITHUB_SHA}
          target: ${{ matrix.target }}
          built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          contents: include/syncbond.h (C ABI), libsyncbond_ffi.a (musl static)
          EOF
          tar -czf "dist/syncbond-nightly-${{ matrix.target }}.tar.gz" -C dist/pkg .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-core-${{ matrix.target }}
          path: dist/syncbond-nightly-*.tar.gz
  # Binding packages, each via the exact command its ci.yml job uses:
  # wheels via maturin (with the install+pytest face), N-API prebuilt via
  # `pnpm --filter @syncbond/bindings-ts build`, WASM via build:wasm
  # (wasm-pack). N-API/Python legs build on both arches (glibc); the WASM
  # package is arch-independent and built once.
  bindings:
    needs: gate
    if: needs.gate.outputs.fresh == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: nightly-bindings-${{ matrix.arch }}
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: wasm-pack
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade "maturin>=1.5" pytest
      # rust-cache restores target/ wholesale; stale wheels/site dirs from a
      # previous run must not survive into this build (see ci.yml wheels job).
      - run: rm -rf target/wheels target/site
      - name: Build Python wheel (maturin)
        run: maturin build -m crates/syncbond-python/Cargo.toml --release -o target/wheels
      - name: Install the wheel and run the pytest suite
        run: |
          mkdir -p target/site
          python -m pip install --quiet --target target/site target/wheels/*.whl
          PYTHONPATH=target/site python -m pytest -q crates/syncbond-python/tests/test_pair_sync.py
      - name: Build N-API prebuilt binding
        run: pnpm --filter @syncbond/bindings-ts build
      - name: Package N-API prebuilt binding
        run: |
          mkdir -p dist
          tar -czf "dist/syncbond-nightly-napi-${{ matrix.arch }}.tar.gz" \
            -C packages/ts-bindings/src/native .
      - name: Build WASM package
        if: matrix.arch == 'x86_64'
        run: pnpm --filter @syncbond/bindings-ts build:wasm
      - name: Package WASM bindings
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p dist
          tar -czf dist/syncbond-nightly-wasm.tar.gz \
            -C packages/ts-bindings/src/wasm-gen .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-python-${{ matrix.arch }}
          path: target/wheels/*.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-napi-${{ matrix.arch }}
          path: dist/syncbond-nightly-napi-*.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.arch == 'x86_64'
        with:
          name: nightly-wasm
          path: dist/syncbond-nightly-wasm.tar.gz
  publish:
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.fresh == 'true'
    needs: [gate, core, bindings]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          # A single glob: download-artifact does not split a multi-line
          # pattern, so match every nightly artifact prefix with one pattern.
          pattern: nightly-*
          merge-multiple: true
          path: dist/
      - name: Publish rolling nightly release (single release)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum syncbond-nightly-*.tar.gz syncbond-*.whl > SHA256SUMS
          cat > notes.md <<NOTES
          Automated nightly prerelease from commit ${GITHUB_SHA}.
          Contents: syncbond-nightly-<target>.tar.gz (C header + musl static lib,
          Linux x86_64 / aarch64), syncbond wheels and N-API prebuilt
          bindings (Linux x86_64 / aarch64, glibc), and the browser WASM package.
          SHA256SUMS verifies the downloaded assets; BUILD_INFO inside each
          archive records the source commit. Every asset was built only after
          fmt + clippy + the full workspace test suite passed.
          This is NOT a stable release: nightly is a rolling build-artifact
          channel. npm/crates.io publishing stays blocked; versioned releases
          are issued manually by the maintainer only. The nightly tag tracks
          the most recent successful build.
          NOTES
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
            gh release upload nightly syncbond-nightly-*.tar.gz syncbond-*.whl SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease --title 'Nightly' --notes-file notes.md
          else
            gh release create nightly syncbond-nightly-*.tar.gz syncbond-*.whl SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Nightly' --notes-file notes.md
          fi
