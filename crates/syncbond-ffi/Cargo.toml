[package]
name = "syncbond-ffi"
description = "Stable C ABI over syncbond-core; every language binding consumes this"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "syncbond_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
syncbond-core = { path = "../syncbond-core" }
serde_json = "1"
