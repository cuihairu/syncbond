[package]
name = "syncbond-ffi"
description = "Stable C ABI over syncbond-core; every language binding consumes this"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "syncbond_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# The relay HTTP driver (DSR-36) is a native tokio/net + rustls stack that
# cannot build for wasm32-unknown-unknown (no socket or C toolchain for the
# target). It is an opt-out feature: native bindings get it by default, and
# the wasm bindings disable it to keep only the thread-free surface.
default = ["relay"]
relay = ["dep:syncbond-relay-client", "dep:tokio"]

[dependencies]
syncbond-core = { path = "../syncbond-core" }
syncbond-relay-client = { path = "../syncbond-relay-client", optional = true }
serde_json = "1"
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "time"], optional = true }

[dev-dependencies]
# The real relay, in-process, for the relay driver's integration test.
syncbond-server = { path = "../../apps/syncbond-server", features = ["test-support"] }
syncbond-relay-protocol = { path = "../syncbond-relay-protocol" }
