[package]
name = "syncbond-python"
description = "Python bindings for syncbond over the syncbond-ffi handles"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "syncbond"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
syncbond-ffi = { path = "../syncbond-ffi" }

[build-dependencies]
pyo3-build-config = { version = "0.29" }
