[workspace]
resolver = "2"
members = [
    "apps/syncbond-server",
    "crates/syncbond-core",
    "crates/syncbond-relay-protocol",
    "crates/syncbond-ffi",
    "crates/syncbond-napi",
    "crates/syncbond-python",
    "crates/syncbond-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["cuihairu"]

[workspace.dependencies]
p256 = { version = "0.14", features = ["ecdsa", "arithmetic"] }
elliptic-curve = "0.14"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
scrypt = "0.11"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Default relay server (apps/syncbond-server). rusqlite builds its own SQLite
# so a deployer machine without system libsqlite3 still builds.
rusqlite = { version = "0.42", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
base64 = "0.23"

# Schema conformance of the frozen envelope wire shape; test-only.
jsonschema = { version = "0.61", default-features = false }

[profile.test]
opt-level = 2
